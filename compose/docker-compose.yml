# Zabbix 7.0 LTS (server + web + PostgreSQL) untuk lab NMS.
# Password database dibaca dari file .env (lihat ../.env.example).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: zabbix
    volumes:
      - db-data:/var/lib/postgresql/data

  server:
    image: zabbix/zabbix-server-pgsql:ubuntu-7.0-latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_SERVER_HOST: db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: zabbix
    volumes:
      # Samakan zona waktu pesan alert dengan zona waktu VM (WIB)
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "10051:10051"

  web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.0-latest
    restart: unless-stopped
    depends_on:
      - db
      - server
    environment:
      ZBX_SERVER_HOST: server
      DB_SERVER_HOST: db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: zabbix
      PHP_TZ: Asia/Jakarta
    ports:
      - "8080:8080"

volumes:
  db-data:
